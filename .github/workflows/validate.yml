name: Validate AimeFilms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py core tests
      - name: Test local media storage
        run: python -m unittest discover -s tests -v
      - name: Verify API route registration
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aimefilms
          ADMIN_NAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-password
          TOKEN_SECRET: ci-token-secret-that-is-at-least-thirty-two-characters-long
          VIDEO_STORAGE_DRIVER: local
        run: |
          python - <<'PY'
          from app import app
          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/media",
              "/api/admin/videos/create-upload",
              "/api/admin/videos/complete-upload",
              "/api/admin/videos/upload",
              "/api/admin/movies",
              "/api/admin/movies/{movie_id}",
              "/api/admin/users",
              "/api/admin/users/{email}",
              "/api/admin/users/{email}/toggle-block",
              "/api/admin/messages",
              "/api/admin/messages/{message_id}/read",
              "/api/admin/messages/{message_id}",
              "/api/admin/system",
              "/api/auth/register",
              "/api/auth/login",
              "/api/movies",
          }
          missing = required - paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          print(f"Verified {len(required)} required API routes")
          PY
