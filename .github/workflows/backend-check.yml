name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend-python/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend-python/**"
      - ".github/workflows/backend-check.yml"

jobs:
  validate-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q app.py core tests
      - name: Test local media storage
        run: python -m unittest discover -s tests -v
      - name: Verify protected API routes and media mount
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aimefilms
          ADMIN_NAME: ci-admin
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-only-password
          TOKEN_SECRET: ci-only-token-secret
          VIDEO_STORAGE_DRIVER: local
        run: |
          python - <<'PY'
          from app import app
          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/media",
              "/api/admin/videos/create-upload",
              "/api/admin/videos/complete-upload",
              "/api/admin/videos/upload",
              "/api/admin/media-assets/upload",
              "/api/admin/movies",
              "/api/admin/users",
              "/api/admin/messages",
              "/api/admin/system",
              "/api/auth/register",
              "/api/auth/login",
          }
          missing = required - paths
          assert not missing, f"Missing API routes: {sorted(missing)}"
          print(f"Verified {len(required)} required API routes")
          PY
