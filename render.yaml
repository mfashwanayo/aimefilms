services:
  - type: web
    name: aimefilms-api
    runtime: python
    plan: free
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
